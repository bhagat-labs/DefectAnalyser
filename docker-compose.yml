version: '3.8'

services:
  backend:
    build: .
    container_name: defect-api
    ports:
      - "8000:8000"
    volumes:
      - ./model_store:/app/model_store
    command: uvicorn serving.api:app --host 0.0.0.0 --port 8000
    restart: always

  frontend:
    build: .
    container_name: defect-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://defect-api:8000/predict
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend
    restart: always